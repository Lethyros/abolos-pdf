# cargo-about: sammelt die Lizenztexte aller Rust-Bibliotheken, die ins Programm eingehen
# (Aufruf über werkzeuge/lizenzen.sh)
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "Unicode-3.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
# nur die Linux-Plattform, für die gebaut wird
targets = ["x86_64-unknown-linux-gnu"]
