[package]
name = "abolos-pdf"
version = "0.9.0"
edition = "2024"
authors = ["Oliver Weber"]
description = "Offline-PDF-Reader für Linux und Windows: lesen, suchen, markieren, kommentieren – ohne Abo, ohne Netzwerkzugriff"
license = "GPL-3.0-or-later"
readme = "README.md"
# nur für den eigenen Einsatz, nicht auf crates.io
publish = false

[dependencies]
chrono = "0.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe", "image_latest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"

# Schutzmaßnahmen je Betriebssystem (src/schutz.rs)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemServices", "Win32_System_Threading"] }

[build-dependencies]
cxx-qt-build = "0.10"

# Symbol und Versionsangaben in der .exe
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Codeprüfung (siehe doku/standards.md): jede unsafe-Stelle braucht eine SAFETY-Begründung
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
