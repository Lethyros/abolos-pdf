#
# Prüfablauf bei jedem Push und Pull Request (entspricht werkzeuge/pruefen.sh), unter Linux und Windows.
# Alle Aktionen sind auf feste Commits festgelegt (Lieferkette); Dependabot schlägt Updates vor.
# Qt kommt über werkzeuge/qt_holen.py direkt vom Qt-Server (aqtinstall versteht dessen neuen Aufbau nicht).
name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.12.0"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Systempakete für Qt
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev
      - name: Qt laden (offizieller Qt-Server, Prüfsummen geprüft)
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet py7zr==1.1.4
          qt=$("$RUNNER_TEMP/py/bin/python" werkzeuge/qt_holen.py "$QT_VERSION" linux_gcc_64 "$RUNNER_TEMP/qt")
          echo "$qt/bin" >> "$GITHUB_PATH"
          echo "QMAKE=$qt/bin/qmake6" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$qt/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: PDFium laden (SHA256 geprüft)
        run: python3 werkzeuge/pdfium_holen.py linux-x64
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny
      - name: Formatierung
        run: cargo fmt --check
      - name: Statische Analyse (Clippy, keine Warnungen)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Abhängigkeiten (Schwachstellen, Lizenzen, Herkunft)
        run: cargo deny check
      - name: SPDX-Kennzeichnung (REUSE)
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - name: Qt laden (offizieller Qt-Server, Prüfsummen geprüft)
        shell: pwsh
        run: |
          $qt = python werkzeuge/qt_holen.py $env:QT_VERSION win64_msvc2022_64 "$env:RUNNER_TEMP\qt"
          if ($LASTEXITCODE -ne 0) { throw "Qt konnte nicht geladen werden" }
          "$qt\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "QMAKE=$qt\bin\qmake6.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: PDFium laden (SHA256 geprüft)
        run: python werkzeuge/pdfium_holen.py win-x64
      - name: Statische Analyse (Clippy, keine Warnungen)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
