# Monatliche Update-Vorschläge für Rust-Bibliotheken und GitHub-Aktionen (Schwachstellen-Management)
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
